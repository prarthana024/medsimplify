stages:
  - lint
  - security
  - build
  - test
  - deploy

# ─── LINT ───────────────────────────────────────────────────────────────────
lint-backend:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8 black --quiet
  script:
    - echo "Running Python linter..."
    - flake8 backend/ --max-line-length=120 --ignore=E501,W503 || true
    - black --check backend/

lint-frontend:
  stage: lint
  image: node:18-alpine
  before_script:
    - cd frontend && npm ci --silent
  script:
    - echo "Running JS/React linter..."
    - npx eslint src/ --ext .js,.jsx --max-warnings=50

# ─── SECURITY ────────────────────────────────────────────────────────────────
security-scan:
  stage: security
  image: python:3.11-slim
  before_script:
    - pip install bandit --quiet
  script:
    - echo "Running security scan on Python backend..."
    - bandit -r backend/ -ll || 

# ─── BUILD ───────────────────────────────────────────────────────────────────
build-frontend:
  stage: build
  image: node:18-alpine
  before_script:
    - cd frontend && npm ci --silent
  script:
    - echo "Building React frontend..."
    - npm run build
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 hour

build-backend:
  stage: build
  image: python:3.11-slim
  before_script:
    - pip install -r backend/requirements.txt --quiet
  script:
    - echo "Checking backend imports..."
    - python -c "import flask; print('Flask OK')" || python -c "import fastapi; print('FastAPI OK')"

# ─── TEST ────────────────────────────────────────────────────────────────────
test-backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r backend/requirements.txt --quiet
    - pip install pytest --quiet
  script:
    - echo "Running backend tests..."
    - pytest backend/ -v --tb=short 
  

# ─── DEPLOY ──────────────────────────────────────────────────────────────────
deploy-frontend:
  stage: deploy
  image: node:18-alpine
  before_script:
    - npm install -g vercel --silent
  script:
    - echo "Deploying frontend to Vercel..."
    - vercel --token $VERCEL_TOKEN --prod --yes
    - echo "Deploy complete — verifying..."
    - vercel ls --token $VERCEL_TOKEN | grep "production" || (echo "Deploy verification failed" && exit 1)
  only:
    - main

deploy-backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Triggering Render deploy..."
    - |
      response=$(curl -s -o /dev/null -w "%{http_code}" -X POST $RENDER_DEPLOY_HOOK)
      if [ "$response" != "200" ] && [ "$response" != "201" ]; then
        echo "Render webhook returned HTTP $response — deploy failed"
        exit 1
      fi
      echo "Render deploy triggered successfully (HTTP $response)"
  only:
    - main